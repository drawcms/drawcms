name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  sites:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            site-blog/package-lock.json

      - name: Install docs site dependencies
        run: npm ci --prefix site

      - name: Test and build docs site
        run: |
          npm test --prefix site
          npm run build --prefix site
        env:
          # The app origin used by literal HTML embeds in the docs content.
          PUBLIC_DRAWCMS_APP_URL: https://drawcms.com

      - name: Install blog site dependencies
        run: npm ci --prefix site-blog

      - name: Test and build blog site
        run: |
          npm test --prefix site-blog
          npm run build --prefix site-blog
        env:
          PUBLIC_DRAWCMS_APP_URL: https://drawcms.com
