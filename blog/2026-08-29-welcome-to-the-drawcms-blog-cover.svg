<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Welcome to the DrawCMS blog</title>
  <desc id="description">The DrawCMS mark, a stack of Markdown documents, and the phrase Open to read. Open to improve.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#D7E1DC"/>
    </pattern>
    <linearGradient id="mint-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECF8F2"/>
      <stop offset="1" stop-color="#FAFAF9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#mint-wash)"/>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.72"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(104 92)">
      <path d="M0 0h38c44 0 80 36 80 80s-36 80-80 80H0V0Z" fill="#0C8C5E" opacity="0.25"/>
      <path d="M0 0h18c44 0 80 36 80 80s-36 80-80 80H0V0Z" fill="#0C8C5E"/>
      <text x="145" y="62" fill="#0C8C5E" font-size="28" font-weight="700" letter-spacing="3">DRAWCMS</text>
      <text x="145" y="106" fill="#66706C" font-size="24">Open-source notes</text>
    </g>

    <text x="104" y="424" fill="#121715" font-family="Georgia, 'Times New Roman', serif" font-size="91" letter-spacing="-4">Plain Markdown.</text>
    <text x="104" y="520" fill="#121715" font-family="Georgia, 'Times New Roman', serif" font-size="91" letter-spacing="-4">Open by default.</text>
    <text x="111" y="596" fill="#66706C" font-size="28">Read it. Improve it. Send a pull request.</text>

    <g transform="translate(1028 180) rotate(5 220 290)">
      <rect x="88" y="52" width="390" height="570" rx="12" fill="#DDEBE4" stroke="#B8CBC1" stroke-width="2"/>
      <rect x="44" y="26" width="390" height="570" rx="12" fill="#EEF6F2" stroke="#B8CBC1" stroke-width="2"/>
      <rect width="390" height="570" rx="12" fill="#FFFFFF" stroke="#B8CBC1" stroke-width="2"/>
      <rect x="42" y="46" width="116" height="34" rx="4" fill="#ECF8F2"/>
      <text x="58" y="70" fill="#0C8C5E" font-family="ui-monospace, monospace" font-size="18" font-weight="700">POST.MD</text>
      <rect x="42" y="122" width="286" height="16" rx="4" fill="#121715"/>
      <rect x="42" y="160" width="224" height="11" rx="4" fill="#A1AEA8"/>
      <rect x="42" y="184" width="278" height="11" rx="4" fill="#C0CBC5"/>
      <rect x="42" y="246" width="182" height="13" rx="4" fill="#0C8C5E"/>
      <rect x="42" y="286" width="300" height="10" rx="4" fill="#C0CBC5"/>
      <rect x="42" y="313" width="260" height="10" rx="4" fill="#C0CBC5"/>
      <rect x="42" y="340" width="290" height="10" rx="4" fill="#C0CBC5"/>
      <rect x="42" y="403" width="136" height="13" rx="4" fill="#0C8C5E"/>
      <rect x="42" y="443" width="278" height="10" rx="4" fill="#C0CBC5"/>
      <rect x="42" y="470" width="231" height="10" rx="4" fill="#C0CBC5"/>
    </g>

    <g transform="translate(104 805)">
      <rect width="436" height="84" rx="8" fill="#FFFFFF" stroke="#D7E1DC"/>
      <circle cx="42" cy="42" r="14" fill="#0C8C5E"/>
      <text x="76" y="51" fill="#121715" font-size="24" font-weight="650">Open to read. Open to improve.</text>
    </g>
  </g>
</svg>
